<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gangetabell-sangen · animasjon</title>
  <meta name="description" content="En animert gangetabell synket til Gangertabell-sangen." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Start overlay (required for audio autoplay policy) -->
  <div id="start" class="overlay">
    <div class="start-card">
      <div class="start-emoji">🎵 ✖️ 🔢</div>
      <h1>Gangetabell&shy;sangen</h1>
      <p>Syng og lær gangetabellen 1&ndash;6 sammen med musikken.</p>
      <button id="startBtn" class="play-btn">▶ Start sangen</button>
      <p class="hint">4 minutter · 60 gangestykker</p>
    </div>
  </div>

  <main id="stage" aria-hidden="true">
    <!-- Top bar: table chips + progress -->
    <header class="topbar">
      <div class="brand">Gangetabellen</div>
      <div id="tableChips" class="chips"></div>
      <button id="toggle" class="mini-btn" title="Pause/spill">❚❚</button>
    </header>

    <section class="content">
      <!-- Left: the spoken fact, big -->
      <div class="fact-pane">
        <div id="factEq" class="equation">
          <span class="fa">1</span>
          <span class="op">×</span>
          <span class="fb">1</span>
          <span class="eq">=</span>
          <span class="fc">1</span>
        </div>
        <div id="lyric" class="lyric">&nbsp;</div>
        <div id="array" class="array" aria-label="visualisering av gangestykket"></div>
      </div>

      <!-- Right: the 10x10 Pythagoras grid filling in -->
      <div class="grid-pane">
        <div class="grid-title">Gangetabellen din vokser</div>
        <div id="grid" class="grid"></div>
      </div>
    </section>

    <!-- Progress bar synced to audio -->
    <footer class="progress-wrap">
      <div id="progress" class="progress"><div id="progressFill" class="progress-fill"></div></div>
      <div id="time" class="time">0:00 / 4:00</div>
    </footer>
  </main>

  <audio id="audio" preload="auto" src="assets/gangertabell.m4a"></audio>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
